name: blacksite

x-hoppscotch-environment: &hoppscotch-environment
  DATABASE_URL: postgresql://hoppscotch:${HOPPSCOTCH_DB_PASSWORD}@hoppscotch-db:5432/hoppscotch
  DATA_ENCRYPTION_KEY: ${HOPPSCOTCH_DATA_ENCRYPTION_KEY}
  INFRA.SESSION_SECRET: ${HOPPSCOTCH_SESSION_SECRET}
  WHITELISTED_ORIGINS: ${HOPPSCOTCH_PUBLIC_URL},app://localhost_3200,app://hoppscotch
  TRUST_PROXY: "false"
  ENABLE_SUBPATH_BASED_ACCESS: "true"
  # 8080 is reserved by the AIO backend; Caddy uses this separate public port.
  HOPP_AIO_ALTERNATE_PORT: "3000"
  VITE_BASE_URL: ${HOPPSCOTCH_PUBLIC_URL}
  VITE_SHORTCODE_BASE_URL: ${HOPPSCOTCH_PUBLIC_URL}
  VITE_ADMIN_URL: ${HOPPSCOTCH_PUBLIC_URL}/admin
  VITE_BACKEND_GQL_URL: ${HOPPSCOTCH_PUBLIC_URL}/backend/graphql
  VITE_BACKEND_WS_URL: ${HOPPSCOTCH_WS_URL}/backend/graphql
  VITE_BACKEND_API_URL: ${HOPPSCOTCH_PUBLIC_URL}/backend/v1
  VITE_PROXYSCOTCH_ACCESS_TOKEN: ""

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.10.1
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${OPEN_WEBUI_PORT:-9000}:8080"
    environment:
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET_KEY}
      WEBUI_ADMIN_EMAIL: ${OPEN_WEBUI_ADMIN_EMAIL:-admin@blacksite.local}
      WEBUI_ADMIN_PASSWORD: ${OPEN_WEBUI_ADMIN_PASSWORD}
      WEBUI_ADMIN_NAME: ${OPEN_WEBUI_ADMIN_NAME:-Blacksite Admin}
      WEBUI_URL: ${OPEN_WEBUI_PUBLIC_URL:-http://localhost:9000}
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_SIGNUP: "false"
      DEFAULT_USER_ROLE: pending
      ENABLE_PASSWORD_VALIDATION: "true"
      PASSWORD_VALIDATION_REGEX_PATTERN: "^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{12,72}"
      PASSWORD_VALIDATION_HINT: Minimum 12 characters with uppercase, lowercase, number, and special character.
      JWT_EXPIRES_IN: ${OPEN_WEBUI_JWT_EXPIRES_IN:-24h}
      CORS_ALLOW_ORIGIN: ${OPEN_WEBUI_CORS_ALLOW_ORIGIN:-http://localhost:9000;http://127.0.0.1:9000}
      FORWARDED_ALLOW_IPS: ${OPEN_WEBUI_FORWARDED_ALLOW_IPS:-127.0.0.1}
      XFRAME_OPTIONS: DENY
      XCONTENT_TYPE: nosniff
      REFERRER_POLICY: strict-origin-when-cross-origin
      PERMISSIONS_POLICY: camera=(),microphone=(self),geolocation=()
      CONTENT_SECURITY_POLICY_REPORT_ONLY: "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https: wss:; script-src 'self'; style-src 'self' 'unsafe-inline'"
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_ADMIN_EXPORT: "false"
      ENABLE_DIRECT_CONNECTIONS: "false"
      ENABLE_ADMIN_CHAT_ACCESS: "false"
      ENABLE_OPENAI_API_PASSTHROUGH: "false"
      ENABLE_API_KEYS: "true"
      ENABLE_API_KEYS_ENDPOINT_RESTRICTIONS: "true"
      API_KEYS_ALLOWED_ENDPOINTS: ${OPEN_WEBUI_API_KEYS_ALLOWED_ENDPOINTS:-/api/chat/completions,/api/v1/models,/api/models,/api/v1/tools,/api/v1/tasks,/api/v1/retrieval,/api/v1/auths/admin/config,/api/v1/configs/connections}
      USER_PERMISSIONS_WORKSPACE_MODELS_ACCESS: "false"
      USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ACCESS: "false"
      USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS: "false"
      USER_PERMISSIONS_WORKSPACE_TOOLS_IMPORT: "false"
      USER_PERMISSIONS_WORKSPACE_PROMPTS_ACCESS: "false"
      ENABLE_PIP_INSTALL_FRONTMATTER_REQUIREMENTS: "false"
      AUDIT_LOG_LEVEL: METADATA
      ENABLE_AUDIT_LOGS_FILE: "true"
      AUDIT_LOGS_FILE_PATH: /app/backend/data/audit.log
      AUDIT_LOG_FILE_ROTATION_SIZE: 10MB
      ENABLE_AUDIT_STDOUT: "true"
      LOG_FORMAT: json
      GLOBAL_LOG_LEVEL: INFO
      REQUESTS_VERIFY: "true"
      AIOHTTP_CLIENT_SESSION_SSL: "true"
      AIOHTTP_CLIENT_SESSION_TOOL_SERVER_SSL: "true"
      ENABLE_WEB_LOADER_SSL_VERIFICATION: "true"
      ENABLE_RAG_LOCAL_WEB_FETCH: "false"
      AIOHTTP_CLIENT_ALLOW_REDIRECTS: "false"
      ENABLE_PROFILE_IMAGE_URL_FORWARDING: "false"
      IFRAME_CSP: "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src 'none'"
      RAG_FILE_MAX_SIZE: ${OPEN_WEBUI_RAG_FILE_MAX_SIZE:-50}
      RAG_FILE_MAX_COUNT: ${OPEN_WEBUI_RAG_FILE_MAX_COUNT:-10}
      RAG_ALLOWED_FILE_EXTENSIONS: ${OPEN_WEBUI_RAG_ALLOWED_FILE_EXTENSIONS:-.pdf,.txt,.md,.docx,.csv,.tsv,.json,.jsonl,.xml,.html,.nessus,.db,.zip,.yaml,.yml,.log}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENABLE_VERSION_UPDATE_CHECK: "false"
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      WEB_SEARCH_RESULT_COUNT: "5"
      WEB_SEARCH_CONCURRENT_REQUESTS: "10"
      SEARXNG_QUERY_URL: http://searxng:8080/search?q=<query>
      BLACKSITE_INPUT_DIR: /workspace/input
      BLACKSITE_OUTPUT_DIR: /workspace/output
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - open-webui-data:/app/backend/data
      - ${OPEN_WEBUI_INPUT_DIR:-./workspace/input}:/workspace/input:ro
      - ${OPEN_WEBUI_OUTPUT_DIR:-./workspace/output}:/workspace/output:rw
    networks:
      - tools
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 30
      start_period: 20s

  open-webui-tools-deploy:
    image: ghcr.io/open-webui/open-webui:v0.10.1
    restart: "no"
    entrypoint: ["python", "/deployer/deploy-openwebui-tools.py"]
    environment:
      OPEN_WEBUI_URL: http://open-webui:8080
      OPEN_WEBUI_ADMIN_EMAIL: ${OPEN_WEBUI_ADMIN_EMAIL:-admin@blacksite.local}
      OPEN_WEBUI_ADMIN_PASSWORD: ${OPEN_WEBUI_ADMIN_PASSWORD}
      OPEN_WEBUI_TOOLS_TOKEN: ${OPEN_WEBUI_TOOLS_TOKEN:-}
      OPEN_WEBUI_PUBLIC_URL: ${OPEN_WEBUI_PUBLIC_URL:-http://localhost:9000}
      OPEN_WEBUI_JWT_EXPIRES_IN: ${OPEN_WEBUI_JWT_EXPIRES_IN:-24h}
      OPEN_WEBUI_API_KEYS_ALLOWED_ENDPOINTS: ${OPEN_WEBUI_API_KEYS_ALLOWED_ENDPOINTS:-/api/chat/completions,/api/v1/models,/api/models,/api/v1/tools,/api/v1/tasks,/api/v1/retrieval,/api/v1/auths/admin/config,/api/v1/configs/connections}
      OPEN_WEBUI_RAG_FILE_MAX_SIZE: ${OPEN_WEBUI_RAG_FILE_MAX_SIZE:-50}
      OPEN_WEBUI_RAG_FILE_MAX_COUNT: ${OPEN_WEBUI_RAG_FILE_MAX_COUNT:-10}
      OPEN_WEBUI_RAG_ALLOWED_FILE_EXTENSIONS: ${OPEN_WEBUI_RAG_ALLOWED_FILE_EXTENSIONS:-.pdf,.txt,.md,.docx,.csv,.tsv,.json,.jsonl,.xml,.html,.nessus,.db,.zip,.yaml,.yml,.log}
    volumes:
      - ./scripts/deploy-openwebui-tools.py:/deployer/deploy-openwebui-tools.py:ro
      - ./openwebui-tools:/tools:ro
    depends_on:
      open-webui:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - tools

  searxng:
    image: searxng/searxng:2026.7.17-81c9c2386
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${SEARXNG_PORT:-9006}:8080"
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_PUBLIC_URL:-http://localhost:9006/}
      SEARXNG_SECRET: ${SEARXNG_SECRET_KEY}
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    networks:
      - tools

  hoppscotch-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hoppscotch
      POSTGRES_USER: hoppscotch
      POSTGRES_PASSWORD: ${HOPPSCOTCH_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoppscotch -d hoppscotch"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - hoppscotch-db-data:/var/lib/postgresql/data
    networks:
      - tools

  hoppscotch-migrate:
    image: hoppscotch/hoppscotch:2026.3.1
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["pnpm exec prisma migrate deploy"]
    environment: *hoppscotch-environment
    depends_on:
      hoppscotch-db:
        condition: service_healthy
    networks:
      - tools

  hoppscotch:
    image: hoppscotch/hoppscotch:2026.3.1
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOPPSCOTCH_PORT:-9001}:3000"
    environment: *hoppscotch-environment
    depends_on:
      hoppscotch-db:
        condition: service_healthy
      hoppscotch-migrate:
        condition: service_completed_successfully
    networks:
      - tools

  cloudbeaver:
    image: dbeaver/cloudbeaver:26.1.2
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CLOUDBEAVER_PORT:-9002}:8978"
    volumes:
      - cloudbeaver-workspace:/opt/cloudbeaver/workspace
      - ${OPEN_WEBUI_INPUT_DIR:-./workspace/input}:/workspace/input:ro
    networks:
      - tools

  revshell:
    build:
      context: ./containers/revshell
      args:
        REVSHELL_REF: ${REVSHELL_REF:-9fda27f91b1b1f370539dd534bc3bbb1f6b49bf6}
    image: localhost/blacksite-revshell:${REVSHELL_REF:-9fda27f91b1b1f370539dd534bc3bbb1f6b49bf6}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REVSHELL_PORT:-9004}:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks:
      - tools

  cyberchef:
    image: ghcr.io/gchq/cyberchef:11.2.0
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CYBERCHEF_PORT:-9003}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    networks:
      - tools

  hacktricks:
    build:
      context: ./containers/hacktricks
      args:
        HACKTRICKS_REF: ${HACKTRICKS_REF:-44710df25c15548cb3b03227d62c7773835aa5b3}
    image: localhost/blacksite-hacktricks:${HACKTRICKS_REF:-44710df25c15548cb3b03227d62c7773835aa5b3}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HACKTRICKS_PORT:-9005}:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks:
      - tools

networks:
  tools:
    driver: bridge

volumes:
  open-webui-data:
  hoppscotch-db-data:
  cloudbeaver-workspace:
