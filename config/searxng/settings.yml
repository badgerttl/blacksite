use_default_settings: true

general:
  debug: false
  instance_name: Blacksite Search

search:
  safe_search: 0
  autocomplete: duckduckgo
  formats:
    - html
    - json

server:
  # Overridden at runtime by SEARXNG_SECRET and SEARXNG_BASE_URL.
  secret_key: change-me
  limiter: false
  image_proxy: true

ui:
  default_theme: simple
  theme_args:
    simple_style: dark

